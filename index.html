<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vadhwa - My Websites Portal</title>
    <style>
        /* Modern reset & base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #38bdf8;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        header p {
            color: #94a3b8;
            font-size: 1rem;
        }

        /* Container for all hero sections */
        #sites-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Individual Hero Bar Section */
        .hero-bar {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            border-left: 5px solid #38bdf8;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .hero-bar:hover {
            transform: translateY(-3px);
            border-color: #38bdf8;
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.15);
        }

        /* Top row with Title & Open Button */
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 15px;
        }

        .site-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #ffffff;
        }

        .open-btn {
            display: inline-block;
            background-color: #0284c7;
            color: #ffffff;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background-color 0.2s ease;
            white-space: nowrap;
        }

        .open-btn:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }

        /* Bottom text link */
        .url-text-link {
            display: inline-block;
            color: #94a3b8;
            font-size: 0.85rem;
            text-decoration: none;
            word-break: break-all;
            transition: color 0.2s ease;
        }

        .url-text-link:hover {
            color: #38bdf8;
            text-decoration: underline;
        }

        /* Loading & Error Text */
        .loading {
            text-align: center;
            color: #94a3b8;
            font-size: 1.1rem;
        }

        /* Responsive Design */
        @media (max-width: 500px) {
            .top-row {
                flex-direction: column;
                align-items: flex-start;
            }
            .open-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Vadhwa Portal</h1>
        <p>Sabhi Websites Ek Hi Jagah Par</p>
    </header>

    <main id="sites-container">
        <div class="loading">Loading websites list...</div>
    </main>

    <script>
        // Fetch sites from sites.json
        fetch('sites.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('sites.json file load nahi ho saki');
                }
                return response.json();
            })
            .then(data => {
                const container = document.getElementById('sites-container');
                container.innerHTML = ''; // Loading text ko clear karein

                if (data.length === 0) {
                    container.innerHTML = '<div class="loading">Koi site link nahi mila.</div>';
                    return;
                }

                // Har item ke liye alag hero bar section banana
                data.forEach(site => {
                    const heroBar = document.createElement('div');
                    heroBar.className = 'hero-bar';

                    heroBar.innerHTML = `
                        <div class="top-row">
                            <div class="site-title">${site.title}</div>
                            <a href="${site.url}" target="_blank" class="open-btn">Open Site</a>
                        </div>
                        <div>
                            <a href="${site.url}" target="_blank" class="url-text-link">${site.url}</a>
                        </div>
                    `;

                    container.appendChild(heroBar);
                });
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('sites-container').innerHTML = 
                    '<div class="loading" style="color: #ef4444;">Error: sites.json load nahi ho saki. Kripya check karein file same folder me hai ya nahi.</div>';
            });
    </script>

</body>
</html>
